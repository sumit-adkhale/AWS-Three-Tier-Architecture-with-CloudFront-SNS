# WEB TIER (Nginx). CloudFront sends only /api/* here; static files come from S3.
# INTERNAL_ALB_DNS is replaced at boot by deploy/web-tier-userdata.sh
user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;                      # do not advertise the Nginx version
    client_max_body_size 1m;                # reject oversized request bodies
    gzip on;
    gzip_types application/json text/plain;

    # Real client IP = first address in X-Forwarded-For (added by CloudFront and the ALB)
    map $http_x_forwarded_for $client_ip {
        "~^(?<first>[^,\s]+)" $first;
        default $remote_addr;
    }

    # Rate limit: 10 requests/second per client IP, bursts of 20 allowed
    limit_req_zone $client_ip zone=api:10m rate=10r/s;
    limit_req_status 429;

    log_format main '$client_ip [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80 default_server;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Health check for the public ALB target group
        location = /health {
            default_type text/plain;
            return 200 'ok';
        }

        # Forward API calls to the INTERNAL load balancer (app tier)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            resolver 169.254.169.253 valid=10s;          # AWS VPC DNS, so ALB IP changes are picked up
            set $backend "http://INTERNAL_ALB_DNS";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Everything else is not served here (static files live in S3)
        location / { return 404; }
    }
}
